name: Verify Public Source
on:
  push:
    paths: [apps.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check maintained snapshot
        run: |
          python3 - <<'PY'
          import json
          import source_catalog as c
          d=json.load(open('apps.json'))
          assert d['apps']
          assert all(c.recent(v.get('date')) and c.public_https(v['downloadURL']) for a in d['apps'] for v in a['versions'])
          print('Snapshot apps:', len(d['apps']))
          PY
